# Pull-request check: the reactor must build and flatten cleanly with a CI-style version.
# Nothing is published from here; publishing happens only from main (publish.yml).
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and install with a throwaway revision
        run: mvn -B -Drevision=0.0.0-PR clean install

      - name: Prove the installed parent carries literals, not expressions
        run: |
          set -euo pipefail
          POM="$HOME/.m2/repository/io/github/ttads/platform-parent/0.0.0-PR/platform-parent-0.0.0-PR.pom"
          test -f "$POM"
          if grep -q '\${revision}' "$POM"; then
            echo "::error::flatten did not resolve \${revision} in the published parent POM"; exit 1
          fi
          grep -q '<parameters>true</parameters>' "$POM"
          grep -q '<pluginManagement>' "$POM"
          grep -c '<version>0.0.0-PR</version>' "$POM" | grep -qx 2   # own version + BOM import
